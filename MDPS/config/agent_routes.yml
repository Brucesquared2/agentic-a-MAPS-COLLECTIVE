# Agent Routing Configuration for MDPS-OmniCore

routes:
  # High-level planning and orchestration
  - task_type: planning
    description: "Complex planning, batch transformations, high-level design"
    agent: claude_capsule
    priority: high
    timeout: 300s
    fallback: copilot_companion

  # Code generation and scaffolding
  - task_type: code_generation
    description: "Scaffold code, inline editing, reproducible workflows"
    agent: copilot_companion
    priority: high
    timeout: 180s
    fallback: null

  # Code review and quality checks
  - task_type: code_review
    description: "Code-level reviews and quality checks"
    agent: copilot_companion
    priority: medium
    timeout: 120s
    fallback: null

  # Local model inference
  - task_type: analysis
    description: "Local model hosting and inference tasks"
    agent: ollama_local
    priority: medium
    timeout: 240s
    fallback: null

  # File system operations
  - task_type: file_operations
    description: "File system mastery and runtime configuration"
    agent: qwen_2_5_b7
    priority: high
    timeout: 180s
    fallback: deepseek

  # Specialized indexing
  - task_type: indexing
    description: "Specialized indexing and search operations"
    agent: deepseek
    priority: medium
    timeout: 240s
    fallback: qwen_2_5_b7

  # Batch transformations
  - task_type: batch_transform
    description: "Normalize headers, metadata, naming conventions"
    agent: claude_capsule
    priority: high
    timeout: 600s
    fallback: null

  # Integration hooks
  - task_type: integration
    description: "External API connections, data pulls"
    agent: claude_capsule
    priority: medium
    timeout: 300s
    fallback: copilot_companion

# Agent health checks
health_checks:
  interval: 60s
  timeout: 10s
  retry_attempts: 3

# Coordination policies
coordination:
  # Maximum parallel agent invocations
  max_parallel: 5

  # How to handle agent failures
  failure_policy: fallback_then_retry

  # Result aggregation strategy
  aggregation: sequential

  # Inter-agent communication
  communication:
    protocol: http
    format: json
    compression: gzip
